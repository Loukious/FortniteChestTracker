name: Deploy Chest Tracker to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chest-tracker-pages.yml'
      - 'src/FortniteChestTracker.Web/**'
      - 'src/FortniteChestTracker.Core/**'
      - 'src/FortniteReplayReader/**'
      - 'src/Unreal.Core/**'
      - 'src/Unreal.Encryption/**'
      - 'src/OozSharp/**'
      - 'Directory.Build.*'
      - 'src/Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'COPYING'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chest-tracker-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Test browser app
        run: node --test src/FortniteChestTracker.Web/tests/*.test.mjs

      - name: Publish browser app
        run: dotnet publish src/FortniteChestTracker.Web -c Release -o artifacts/FortniteChestTracker.Web

      - name: Verify static output
        run: |
          test -f artifacts/FortniteChestTracker.Web/wwwroot/index.html
          test -f artifacts/FortniteChestTracker.Web/wwwroot/worker.js
          test -f artifacts/FortniteChestTracker.Web/wwwroot/scanner-pool.js
          test -f artifacts/FortniteChestTracker.Web/wwwroot/replay-cache.js
          test -f artifacts/FortniteChestTracker.Web/wwwroot/_framework/dotnet.js
          test -f artifacts/FortniteChestTracker.Web/wwwroot/licenses/GPL-3.0.txt
          test -f artifacts/FortniteChestTracker.Web/wwwroot/licenses/DOTNET-MIT.txt
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { brotliCompressSync, gzipSync } from 'node:zlib';
          const path = 'artifacts/FortniteChestTracker.Web/wwwroot/licenses.html';
          const source = `https://github.com/${process.env.GITHUB_REPOSITORY}/tree/${process.env.GITHUB_SHA}`;
          const html = readFileSync(path, 'utf8').replaceAll('https://github.com/Loukious/FortniteChestTracker"', `${source}"`);
          const data = Buffer.from(html);
          writeFileSync(path, data);
          writeFileSync(`${path}.br`, brotliCompressSync(data));
          writeFileSync(`${path}.gz`, gzipSync(data));
          JS
          touch artifacts/FortniteChestTracker.Web/wwwroot/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/FortniteChestTracker.Web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
